name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install
        run: bun install --frozen-lockfile

      - name: lint (oxlint + oxfmt --check)
        run: bun run lint

      - name: type check
        run: bun run check

      - name: test
        run: bun run test

      # release と同じ 5 ターゲットを compile し、依存更新で特定ターゲットだけ
      # 落ちるケースをタグ push 前に検出する。
      - name: build
        run: |
          set -eu
          for t in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            bun build --compile --target="$t" ./cli.ts --outfile "dist/md2html-$t"
          done
